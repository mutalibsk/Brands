<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — BRANDS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">BRANDS<span>.</span></a>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <button id="themeBtn" class="icon-btn">☾</button>
  </header>

  <main class="cart-container">
    <section class="section">
      <h1>🛒 Shopping Cart</h1>

      <div class="cart-wrapper">
        <div class="cart-items">
          <div id="emptyCart" class="empty-state">
            <p>Your cart is empty</p>
            <a href="products.html" class="primary-btn">Continue Shopping →</a>
          </div>

          <div id="cartList"></div>
        </div>

        <aside class="cart-summary">
          <h3>Order Summary</h3>

          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotal">₹0</span>
          </div>

          <div class="summary-row">
            <span>Shipping:</span>
            <span id="shipping">Free</span>
          </div>

          <div class="summary-row tax">
            <span>Tax (18%):</span>
            <span id="tax">₹0</span>
          </div>

          <div class="summary-row total">
            <span>Total:</span>
            <span id="total">₹0</span>
          </div>

          <a href="checkout.html" class="primary-btn full-width">Proceed to Checkout →</a>
          <a href="products.html" class="secondary-btn">Continue Shopping</a>
        </aside>
      </div>
    </section>
  </main>

  <footer>
    <div class="logo">BRANDS<span>.</span></div>
    <p>© 2026 BRANDS. All rights reserved.</p>
  </footer>

  <div id="toast"></div>

  <script src="script.js"></script>
  <script src="cart.js"></script>
</body>
</html>
