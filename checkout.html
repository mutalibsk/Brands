<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — BRANDS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">BRANDS<span>.</span></a>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <button id="themeBtn" class="icon-btn">☾</button>
  </header>

  <main class="checkout-container">
    <section class="section">
      <h1>📋 Checkout</h1>

      <div class="checkout-wrapper">
        <form id="checkoutForm" class="checkout-form">
          
          <fieldset>
            <legend>Shipping Information</legend>

            <div class="form-group">
              <label for="fullName">Full Name *</label>
              <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
              <label for="email">Email Address *</label>
              <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number *</label>
              <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
              <label for="address">Street Address *</label>
              <input type="text" id="address" name="address" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="city">City *</label>
                <input type="text" id="city" name="city" required>
              </div>
              <div class="form-group">
                <label for="state">State *</label>
                <input type="text" id="state" name="state" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="zip">ZIP Code *</label>
                <input type="text" id="zip" name="zip" required>
              </div>
              <div class="form-group">
                <label for="country">Country *</label>
                <input type="text" id="country" name="country" value="India" required>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Payment Information</legend>

            <div class="payment-methods">
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="card" checked>
                <span>💳 Credit/Debit Card</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="upi">
                <span>📱 UPI</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="netbanking">
                <span>🏦 Net Banking</span>
              </label>
            </div>

            <div id="cardPayment" class="payment-details">
              <div class="form-group">
                <label for="cardName">Cardholder Name *</label>
                <input type="text" id="cardName" name="cardName" required>
              </div>

              <div class="form-group">
                <label for="cardNumber">Card Number *</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="expiry">Expiry Date *</label>
                  <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required>
                </div>
                <div class="form-group">
                  <label for="cvv">CVV *</label>
                  <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="3" required>
                </div>
              </div>
            </div>

            <div id="upiPayment" class="payment-details" style="display:none;">
              <div class="form-group">
                <label for="upiId">UPI ID *</label>
                <input type="text" id="upiId" name="upiId" placeholder="yourname@upi">
              </div>
            </div>
          </fieldset>

          <label class="checkbox">
            <input type="checkbox" name="terms" required>
            <span>I agree to the Terms & Conditions</span>
          </label>

          <button type="submit" class="primary-btn full-width large">Complete Purchase</button>
        </form>

        <aside class="order-summary">
          <h3>Order Summary</h3>
          <div id="reviewItems"></div>

          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="reviewSubtotal">₹0</span>
          </div>

          <div class="summary-row">
            <span>Shipping:</span>
            <span>Free</span>
          </div>

          <div class="summary-row tax">
            <span>Tax (18%):</span>
            <span id="reviewTax">₹0</span>
          </div>

          <div class="summary-row total">
            <span>Total:</span>
            <span id="reviewTotal">₹0</span>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer>
    <div class="logo">BRANDS<span>.</span></div>
    <p>© 2026 BRANDS. All rights reserved.</p>
  </footer>

  <div id="toast"></div>

  <script src="script.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
